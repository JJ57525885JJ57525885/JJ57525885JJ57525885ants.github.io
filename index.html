<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>桌宠商店</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 50%, #90caf9 100%);
            min-height: 100vh;
            color: #1a237e;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 2px 20px rgba(25, 118, 210, 0.10);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            border-bottom: 1px solid rgba(25, 118, 210, 0.08);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 24px;
            font-weight: 700;
            color: #0d47a1;
            letter-spacing: 0.5px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #1976d2, #42a5f5);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(25, 118, 210, 0.25);
        }

        .navbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: #ffffff;
            border-radius: 40px;
            padding: 8px 18px;
            gap: 8px;
            border: 1.5px solid #e3f2fd;
            transition: all 0.25s ease;
            flex: 1;
            max-width: 360px;
            min-width: 180px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
        }

        .search-box:focus-within {
            border-color: #1976d2;
            box-shadow: 0 4px 16px rgba(25, 118, 210, 0.12);
        }

        .search-box input {
            border: none;
            outline: none;
            font-size: 15px;
            color: #1a237e;
            background: transparent;
            width: 100%;
        }

        .search-box input::placeholder {
            color: #90a4ae;
        }

        .search-box .search-icon {
            font-size: 18px;
            color: #90a4ae;
            flex-shrink: 0;
        }

        /* ---- 警告按钮 ---- */
        .warning-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #ff8f00, #ff6f00);
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            flex-shrink: 0;
            box-shadow: 0 4px 14px rgba(255, 111, 0, 0.35);
            transition: transform 0.2s ease, box-shadow 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-left: 80px;
        }

        .warning-btn::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 2px solid rgba(255, 111, 0, 0.25);
            animation: warningPulse 2s ease-in-out infinite;
        }

        @keyframes warningPulse {
            0%,
            100% {
                transform: scale(1);
                opacity: 0.6;
            }
            50% {
                transform: scale(1.12);
                opacity: 0;
            }
        }

        .warning-btn:hover {
            transform: scale(1.06);
            box-shadow: 0 6px 20px rgba(255, 111, 0, 0.45);
        }

        .warning-btn:active {
            transform: scale(0.92);
        }

        /* ---- 主容器 ---- */
        .main-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 32px 24px 48px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 650;
            color: #0d47a1;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.3px;
        }

        .section-title .dot {
            width: 8px;
            height: 8px;
            background: #1976d2;
            border-radius: 50%;
            display: inline-block;
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
        }

        @media (max-width: 1100px) {
            .app-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (max-width: 880px) {
            .app-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 620px) {
            .app-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 14px;
            }
            .main-container {
                padding: 20px 14px 40px;
            }
            .navbar {
                padding: 12px 16px;
                gap: 12px;
            }
            .logo {
                font-size: 20px;
            }
            .search-box {
                max-width: 200px;
                min-width: 120px;
                padding: 6px 14px;
            }
            .search-box input {
                font-size: 14px;
            }
            .warning-btn {
                width: 36px;
                height: 36px;
                font-size: 17px;
            }
        }

        @media (max-width: 400px) {
            .app-grid {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            .search-box {
                max-width: 140px;
                min-width: 90px;
                padding: 5px 10px;
            }
            .search-box input {
                font-size: 13px;
            }
            .warning-btn {
                width: 32px;
                height: 32px;
                font-size: 15px;
            }
        }

        /* ---- 应用卡片 ---- */
        .app-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 20px 16px 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 4px 16px rgba(25, 118, 210, 0.06);
            transition: transform 0.2s ease, box-shadow 0.25s ease;
            cursor: pointer;
            border: 1px solid rgba(25, 118, 210, 0.05);
            position: relative;
            overflow: hidden;
        }

        .app-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #1976d2, #42a5f5, #1976d2);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .app-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 14px 36px rgba(25, 118, 210, 0.14);
        }

        .app-card:hover::before {
            opacity: 1;
        }

        .app-card:active {
            transform: scale(0.96);
        }

        .app-icon-wrapper {
            position: relative;
            width: 84px;
            height: 84px;
            margin-bottom: 14px;
            border-radius: 22px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
            flex-shrink: 0;
            background: #f5f7fa;
            border: 2px solid #ffffff;
            overflow: hidden;
        }

        .app-icon-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.2s ease;
        }

        .app-card:hover .app-icon-wrapper img {
            transform: scale(1.04);
        }

        .app-icon-fallback {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            background: linear-gradient(135deg, #1976d2, #42a5f5);
            color: #fff;
            border-radius: 22px;
            font-weight: 400;
        }

        .app-icon-fallback.show {
            display: flex;
        }

        .app-name {
            font-size: 16px;
            font-weight: 650;
            color: #0d47a1;
            margin-bottom: 6px;
            letter-spacing: 0.3px;
            line-height: 1.3;
        }

        .app-size {
            font-size: 12px;
            color: #78909c;
            margin-bottom: 16px;
            background: #f5f7fa;
            padding: 2px 12px;
            border-radius: 12px;
            font-weight: 500;
        }

        .download-btn {
            background: linear-gradient(135deg, #1976d2, #42a5f5);
            color: #ffffff;
            border: none;
            border-radius: 30px;
            padding: 10px 28px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 0.4px;
            box-shadow: 0 4px 12px rgba(25, 118, 210, 0.25);
            width: 100%;
            max-width: 140px;
        }

        .download-btn:hover {
            background: linear-gradient(135deg, #1565c0, #1e88e5);
            box-shadow: 0 6px 20px rgba(25, 118, 210, 0.35);
            transform: translateY(-2px);
        }

        .download-btn:active {
            transform: scale(0.94);
            box-shadow: 0 2px 8px rgba(25, 118, 210, 0.2);
        }

        /* ---- 详情浮层 ---- */
        .detail-fullscreen {
            position: fixed;
            inset: 0;
            background: #ffffff;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            transform: translateX(100%);
            transition: transform 0.35s cubic-bezier(0.4, 0.0, 0.2, 1);
            will-change: transform;
        }

        .detail-fullscreen.open {
            transform: translateX(0);
        }

        .detail-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 20px 12px 20px;
            border-bottom: 1px solid #f0f0f5;
            flex-shrink: 0;
            position: relative;
        }

        .close-detail-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #f5f5fa;
            border: none;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #2d2d3f;
            transition: background 0.2s;
        }

        .close-detail-btn:hover {
            background: #e0e0f0;
        }

        .detail-icon-name {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .detail-icon-name .detail-icon-wrap {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            overflow: hidden;
            flex-shrink: 0;
            background: #f5f5fa;
            position: relative;
        }

        .detail-icon-name .detail-icon-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .detail-icon-name .detail-icon-wrap .detail-fallback {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            background: linear-gradient(135deg, #1976d2, #42a5f5);
            color: #fff;
            border-radius: 16px;
        }

        .detail-icon-name .detail-icon-wrap .detail-fallback.show {
            display: flex;
        }

        .detail-title-block {
            display: flex;
            flex-direction: column;
        }

        .detail-app-name {
            font-size: 20px;
            font-weight: 700;
            color: #0d47a1;
            line-height: 1.2;
        }

        .detail-version {
            font-size: 13px;
            color: #78909c;
            font-weight: 500;
        }

        .screenshots-container {
            padding: 20px 20px 10px;
            flex-shrink: 0;
        }

        .screenshots-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
            padding-bottom: 8px;
        }

        .screenshots-scroll img {
            width: 220px;
            height: 320px;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
            scroll-snap-align: start;
            flex-shrink: 0;
            cursor: pointer;
            transition: transform 0.2s ease;
            background: #f0f4f8;
        }

        .screenshots-scroll img:hover {
            transform: scale(1.02);
        }

        .detail-info {
            padding: 16px 20px 24px;
            flex: 1;
        }

        .detail-info h3 {
            font-size: 16px;
            font-weight: 650;
            color: #0d47a1;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .detail-description {
            background: #f8faff;
            border-radius: 16px;
            padding: 16px;
            color: #2d2d3f;
            line-height: 1.6;
            font-size: 15px;
            margin-bottom: 16px;
            border: 1px solid #e3f2fd;
        }

        .detail-download-btn {
            background: linear-gradient(135deg, #1976d2, #42a5f5);
            color: #ffffff;
            border: none;
            border-radius: 30px;
            padding: 14px 32px;
            font-size: 17px;
            font-weight: 650;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 6px 20px rgba(25, 118, 210, 0.3);
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
            margin-top: 8px;
        }

        .detail-download-btn:hover {
            background: linear-gradient(135deg, #1565c0, #1e88e5);
            box-shadow: 0 8px 24px rgba(25, 118, 210, 0.4);
            transform: translateY(-2px);
        }

        .detail-download-wrapper {
            padding: 8px 20px 28px;
            flex-shrink: 0;
        }

        .detail-download-btn:active {
            transform: scale(0.96);
        }

        /* ---- 图片查看器 ---- */
        .image-viewer {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .image-viewer.open {
            opacity: 1;
            visibility: visible;
        }

        .image-viewer img {
            max-width: 95vw;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
            cursor: zoom-out;
        }

        .image-viewer-close {
            position: absolute;
            top: 20px;
            right: 24px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: #ffffff;
            font-size: 32px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: background 0.2s;
        }

        .image-viewer-close:hover {
            background: rgba(255, 255, 255, 0.35);
        }

        /* ---- 空状态 ---- */
        .empty-state {
            display: none;
            text-align: center;
            padding: 60px 20px;
            color: #78909c;
            font-size: 15px;
            grid-column: 1 / -1;
        }

        .empty-state.show {
            display: block;
        }

        /* ---- Toast ---- */
        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #1a237e;
            color: #ffffff;
            padding: 12px 28px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.18);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s;
            z-index: 9999;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }

        /* ---- 警告弹窗 ---- */
        .warning-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 3000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            padding: 24px;
        }

        .warning-modal.open {
            opacity: 1;
            visibility: visible;
        }

        .warning-modal-card {
            background: #ffffff;
            border-radius: 28px;
            max-width: 440px;
            width: 100%;
            padding: 32px 28px 28px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.25);
            transform: scale(0.92) translateY(20px);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
            opacity: 0;
        }

        .warning-modal.open .warning-modal-card {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        .warning-modal-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        .warning-modal-header .icon {
            font-size: 32px;
            flex-shrink: 0;
        }

        .warning-modal-header h2 {
            font-size: 20px;
            font-weight: 700;
            color: #0d47a1;
            margin: 0;
        }

        .warning-modal-body {
            color: #2d2d3f;
            font-size: 15px;
            line-height: 1.7;
        }

        .warning-modal-body .item {
            display: flex;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f5;
        }

        .warning-modal-body .item:last-child {
            border-bottom: none;
            padding-bottom: 4px;
        }

        .warning-modal-body .item .num {
            flex-shrink: 0;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #e3f2fd;
            color: #1976d2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            margin-top: 2px;
        }

        .warning-modal-body .item .text {
            flex: 1;
        }

        .warning-modal-body .item .text strong {
            color: #0d47a1;
        }

        .warning-modal-footer {
            margin-top: 22px;
            display: flex;
            justify-content: flex-end;
        }

        .warning-modal-footer .btn-know {
            background: linear-gradient(135deg, #1976d2, #42a5f5);
            color: #fff;
            border: none;
            border-radius: 30px;
            padding: 10px 32px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(25, 118, 210, 0.25);
            letter-spacing: 0.3px;
        }

        .warning-modal-footer .btn-know:hover {
            background: linear-gradient(135deg, #1565c0, #1e88e5);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(25, 118, 210, 0.35);
        }

        .warning-modal-footer .btn-know:active {
            transform: scale(0.94);
        }

        /* ---- Footer ---- */
        .footer {
            text-align: center;
            padding: 20px 24px 36px;
            color: #78909c;
            font-size: 13px;
            border-top: 1px solid rgba(25, 118, 210, 0.06);
            margin-top: 12px;
        }

        @media (max-width: 500px) {
            .screenshots-scroll img {
                width: 160px;
                height: 240px;
            }
            .warning-modal-card {
                padding: 24px 20px 22px;
            }
            .warning-modal-body {
                font-size: 14px;
            }
            .warning-modal-header h2 {
                font-size: 18px;
            }
        }

        @media (max-width: 380px) {
            .warning-modal-card {
                padding: 18px 16px 18px;
            }
            .warning-modal-body .item {
                padding: 10px 0;
            }
            .warning-modal-body .item .num {
                width: 22px;
                height: 22px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <div class="logo-icon">🛍️</div>
            桌宠商店
        </div>
        <div class="navbar-right">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="搜索桌宠应用…">
            </div>
            <button class="warning-btn" id="warningBtn" aria-label="温馨提示">⚠︎️</button>
        </div>
    </nav>

    <div class="main-container">
        <div class="section-title">
            <span class="dot"></span> 全部应用
        </div>
        <div class="app-grid" id="appGrid">
            <!-- 应用数据通过 JavaScript 动态生成 -->
        </div>
    </div>

    <!-- 详情浮层 -->
    <div class="detail-fullscreen" id="detailFullscreen">
        <div class="detail-header">
            <div class="detail-icon-name">
                <div class="detail-icon-wrap" id="detailIconWrap">
                    <img id="detailIcon" src="" alt="图标">
                    <div class="detail-fallback" id="detailFallback">🐜</div>
                </div>
                <div class="detail-title-block">
                    <span class="detail-app-name" id="detailName">蚁后桌宠</span>
                    <span class="detail-version" id="detailVersion">版本 1.1</span>
                </div>
            </div>
            <button class="close-detail-btn" onclick="closeDetail()">✕</button>
        </div>
        <div class="detail-info">
            <h3>📖 玩法介绍</h3>
            <div class="detail-description" id="detailDescription"></div>
        </div>
        <div class="screenshots-container">
            <div class="screenshots-scroll" id="screenshotsScroll"></div>
        </div>
        <div class="detail-download-wrapper">
            <button class="detail-download-btn" id="detailDownloadBtn">下载应用</button>
        </div>
    </div>

    <!-- 图片查看器 -->
    <div class="image-viewer" id="imageViewer" onclick="closeImageViewer()">
        <button class="image-viewer-close" onclick="closeImageViewer()">✕</button>
        <img id="viewerImage" src="" alt="截图放大">
    </div>

    <!-- 警告弹窗 -->
    <div class="warning-modal" id="warningModal">
        <div class="warning-modal-card">
            <div class="warning-modal-header">
                <span class="icon">⚠︎️</span>
                <h2>温馨提示</h2>
            </div>
            <div class="warning-modal-body">
                <div class="item">
                    <span class="num">1</span>

            let currentDownloadUrl = '蚁后.apk';

            // ---------- Toast ----------
            function showToast(msg) {
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    toast.classList.remove('show');
                }, 2200);
            }

            // ---------- 下载 ----------
            window.downloadApp = function(url) {
                const a = document.createElement('a');
                a.href = url;
                a.download = '';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                showToast('📥 开始下载，请查看浏览器下载列表');
            };

            // ---------- 渲染卡片 ----------
            function renderCards(filter = '') {
                const query = filter.toLowerCase().trim();
                let visibleCount = 0;

                const cards = appGrid.querySelectorAll('.app-card');
                cards.forEach(c => c.remove());

                APPS.forEach((app) => {
                    const nameLower = app.name.toLowerCase();
                    if (query && !nameLower.includes(query)) return;

                    const card = document.createElement('div');
                    card.className = 'app-card';
                    card.dataset.appId = app.id;
                    card.dataset.name = app.name;
                    card.dataset.icon = app.icon;
                    card.dataset.size = app.size;
                    card.dataset.version = app.version;
                    card.dataset.download = app.download;
                    card.dataset.description = app.description;
                    card.dataset.screenshots = JSON.stringify(app.screenshots || []);
                    card.dataset.fallbackEmoji = app.fallbackEmoji || '📱';
                    card.dataset.fallbackBg = app.fallbackBg || 'linear-gradient(135deg, #1976d2, #42a5f5)';

                    const wrap = document.createElement('div');
                    wrap.className = 'app-icon-wrapper';

                    const img = document.createElement('img');
                    img.className = 'app-icon';
                    img.src = app.icon;
                    img.alt = app.name + ' 图标';
                    img.loading = 'lazy';
                    img.dataset.appId = app.id;

                    const fallback = document.createElement('div');
                    fallback.className = 'app-icon-fallback';
                    fallback.textContent = app.fallbackEmoji || '📱';
                    fallback.style.background = app.fallbackBg || 'linear-gradient(135deg, #1976d2, #42a5f5)';

                    img.addEventListener('error', function() {
                        this.style.display = 'none';
                        fallback.classList.add('show');
                    });

                    img.addEventListener('load', function() {
                        fallback.classList.remove('show');
                        this.style.display = 'block';
                    });

                    const src = img.src;
                    img.src = '';
                    img.src = src;

                    wrap.appendChild(img);
                    wrap.appendChild(fallback);
                    card.appendChild(wrap);

                    const nameEl = document.createElement('div');
                    nameEl.className = 'app-name';
                    nameEl.textContent = app.name;
                    card.appendChild(nameEl);

                    const sizeEl = document.createElement('div');
                    sizeEl.className = 'app-size';
                    sizeEl.textContent = app.size;
                    card.appendChild(sizeEl);

                    const btn = document.createElement('button');
                    btn.className = 'download-btn';
                    btn.textContent = '下载';
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        downloadApp(app.download);
                    });
                    card.appendChild(btn);

                    card.addEventListener('click', function() {
                        openDetail(this);
                    });

                    appGrid.insertBefore(card, emptyState);
                    visibleCount++;
                });

                emptyState.classList.toggle('show', visibleCount === 0);

            // ---------- 打开详情 ----------
            window.openDetail = function(card) {
                const appId = card.dataset.appId;
                const app = APPS.find(a => a.id === appId);
                if (!app) return;

                currentAppId = appId;
                currentDownloadUrl = app.download;

                detailIcon.src = app.icon;
                detailIcon.style.display = 'block';
                detailFallback.textContent = app.fallbackEmoji || '📱';
                detailFallback.style.background = app.fallbackBg || 'linear-gradient(135deg, #1976d2, #42a5f5)';
                detailFallback.classList.remove('show');

                const loadCheck = new Image();
                loadCheck.onload = function() {
                    detailIcon.src = app.icon;
                    detailIcon.style.display = 'block';
                    detailFallback.classList.remove('show');
                };
                loadCheck.onerror = function() {
                    detailIcon.style.display = 'none';
                    detailFallback.classList.add('show');
                };
                loadCheck.src = app.icon;

                detailName.textContent = app.name;
                detailVersion.textContent = '版本 ' + (app.version || '1.0');
                detailDescription.textContent = app.description || '暂无详细介绍';

                screenshotsScroll.innerHTML = '';
                const screenshots = app.screenshots || [];
                if (screenshots.length > 0) {
                    screenshots.forEach(src => {
                        const img = document.createElement('img');
                        img.src = src;
                        img.alt = app.name + ' 截图';
                        img.loading = 'lazy';
                        img.addEventListener('click', function(e) {
                            e.stopPropagation();
                            openImageViewer(src);
                        });
                        img.onerror = function() {
                            this.style.display = 'none';
                        };
                        screenshotsScroll.appendChild(img);
                    });
                } else {
                    const placeholder = document.createElement('div');
                    placeholder.style.cssText =

                    screenshotsScroll.appendChild(placeholder);
                }

                detailDownloadBtn.onclick = function() {
                    downloadApp(app.download);
                };

                detailFullscreen.classList.add('open');
                document.body.style.overflow = 'hidden';
            };

            // ---------- 关闭详情 ----------
            window.closeDetail = function() {
                detailFullscreen.classList.remove('open');
                document.body.style.overflow = '';
            };

            // ---------- 图片查看器 ----------
            function openImageViewer(src) {
                viewerImage.src = src;
                imageViewer.classList.add('open');
                document.body.style.overflow = 'hidden';
            }

            window.closeImageViewer = function() {
                imageViewer.classList.remove('open');
                document.body.style.overflow = '';
            };

            imageViewer.addEventListener('click', function(e) {
                if (e.target === imageViewer) {
                    closeImageViewer();
                }
            });

            // ---------- 警告弹窗 ----------
            function openWarning() {
                warningModal.classList.add('open');
                document.body.style.overflow = 'hidden';
            }

            window.closeWarning = function() {
                warningModal.classList.remove('open');
                document.body.style.overflow = '';
            };

            warningBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                openWarning();
            });

            warningModal.addEventListener('click', function(e) {
                if (e.target === warningModal) {
                    closeWarning();
                }
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    if (warningModal.classList.contains('open')) {
                        closeWarning();
                    } else if (imageViewer.classList.contains('open')) {
                        closeImageViewer();
                    } else if (detailFullscreen.classList.contains('open')) {
                        closeDetail();
                    }
                }
            });

            // ---------- 搜索 ----------
            searchInput.addEventListener('input', function() {
